<div class="container my-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-header bg-dark text-white text-center">
          <h4 class="mb-0">🔊 Texto a Audio</h4>
        </div>
        <div class="card-body">

          <!-- Texto -->
          <div class="mb-3">
            <label class="form-label">Texto a convertir</label>
            <textarea
              class="form-control"
              [(ngModel)]="texto"
              rows="4"
              placeholder="Escribí el texto que querés convertir a audio..."
            ></textarea>
          </div>

          <!-- Voz -->
          <div class="mb-3">
            <label class="form-label">Voz</label>
            <select class="form-select" [(ngModel)]="vozSeleccionada">
              <option *ngFor="let voz of voces" [value]="voz.value">{{ voz.label }}</option>
            </select>
          </div>

          <!-- Botón -->
          <div class="d-grid">
            <button class="btn btn-dark" (click)="convertir()" [disabled]="cargando || !texto.trim()">
              <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
              Convertir a Audio
            </button>
          </div>

          <!-- Reproductor -->
          <div *ngIf="audioUrl" class="mt-3">
            <label class="form-label">Resultado:</label>
            <audio controls class="w-100" [src]="audioUrl"></audio>
          </div>

          <!-- Error -->
          <div *ngIf="error" class="alert alert-danger mt-3 text-center">
            {{ error }}
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
