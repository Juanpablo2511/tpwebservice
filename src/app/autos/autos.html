<div class="container my-4">
  <h2 class="mb-4 text-center">🚗 Marcas de Autos</h2>

  <!-- Cargando marcas -->
  <div *ngIf="cargandoMarcas" class="text-center">
    <div class="spinner-border text-primary" role="status"></div>
    <p>Cargando marcas...</p>
  </div>

  <!-- Grid de marcas -->
  <div class="row row-cols-2 row-cols-md-4 g-3">
    <div class="col" *ngFor="let marca of marcas">
      <div
        class="card h-100 text-center shadow-sm"
        style="cursor: pointer;"
        (click)="seleccionarMarca(marca)"
        data-bs-toggle="modal"
        data-bs-target="#modalModelos"
      >
        <div class="card-body d-flex align-items-center justify-content-center">
          <h6 class="card-title mb-0">{{ marca.name }}</h6>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Bootstrap con modelos -->
<div class="modal fade" id="modalModelos" tabindex="-1" aria-labelledby="modalModelosLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="modalModelosLabel">
          Modelos de {{ marcaSeleccionada?.name }}
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <!-- Spinner mientras carga -->
        <div *ngIf="cargandoModelos" class="text-center">
          <div class="spinner-border text-secondary" role="status"></div>
          <p>Cargando modelos...</p>
        </div>

        <!-- Lista de modelos -->
        <ul class="list-group" *ngIf="!cargandoModelos">
          <li class="list-group-item" *ngFor="let modelo of modelos">
            {{ modelo.name }}
          </li>
        </ul>

        <p *ngIf="!cargandoModelos && modelos.length === 0" class="text-muted text-center">
          No se encontraron modelos.
        </p>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>

    </div>
  </div>
</div>
